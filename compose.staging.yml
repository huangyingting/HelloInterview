name: interview-studio-staging
services:
  database:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: studio
      POSTGRES_DB: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private staging database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    image: ${STUDIO_IMAGE:-interview-studio:staging}
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set a private PostgreSQL URL for database:5432/studio}
    command: ["node", "dist-server/db/cli.js", "migrate"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
  api:
    image: ${STUDIO_IMAGE:-interview-studio:staging}
    build: .
    environment:
      APP_MODE: local
      DATABASE_URL: ${DATABASE_URL:?Set a private PostgreSQL URL for database:5432/studio}
      LOG_REQUESTS: "true"
    ports:
      - "127.0.0.1:${STUDIO_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres-data:
