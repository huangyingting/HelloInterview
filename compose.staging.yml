name: interview-studio-staging
services:
  database:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: studio
      POSTGRES_DB: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private staging database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    image: ${STUDIO_IMAGE:-interview-studio:staging}
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set a private PostgreSQL URL for database:5432/studio}
    command: ["node", "dist-server/db/cli.js", "migrate"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
  api:
    image: ${STUDIO_IMAGE:-interview-studio:staging}
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set a private PostgreSQL URL for database:5432/studio}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Set the canonical Auth.js origin}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set the Auth.js session secret}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:?Set the Google client ID}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:?Set the Google client secret}
      AUTH_FACEBOOK_CLIENT_ID: ${AUTH_FACEBOOK_CLIENT_ID:?Set the Facebook app ID}
      AUTH_FACEBOOK_CLIENT_SECRET: ${AUTH_FACEBOOK_CLIENT_SECRET:?Set the Facebook app secret}
      AUTH_INVITED_EMAILS: ${AUTH_INVITED_EMAILS:?Set the invited test addresses}
      AUTH_MFA_ENCRYPTION_KEY: ${AUTH_MFA_ENCRYPTION_KEY:?Set the MFA encryption key}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:${STUDIO_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres-data:
